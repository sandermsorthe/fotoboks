<!DOCTYPE html>
<html lang="no">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Admin - Bilder</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="admin-side">

        <h1>📸 Bilder</h1>


        <section id="login">

            <p>
                Logg inn for å se bildene.
            </p>


            <input
                id="epost"
                type="email"
                placeholder="E-post">


            <input
                id="passord"
                type="password"
                placeholder="Passord">


            <button id="loginKnapp">
                Logg inn
            </button>


            <p id="loginMelding"></p>

        </section>


        <section
            id="bilderSide"
            class="skjult">

            <button id="loggUt">
                Logg ut
            </button>


            <h2>
                Dine bilder
            </h2>


            <div id="bilder"></div>

        </section>

    </main>


    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="admin.js"></script>

</body>

</html>
